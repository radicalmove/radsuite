name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop-ui
        run: npm ci

      - name: Verify frontend
        working-directory: apps/desktop-ui
        run: |
          npm test -- --run
          npm run build

      - name: Verify Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.9.6 --locked

      - name: Build MSI and NSIS installers
        run: cargo tauri build --bundles msi,nsis

      - name: Verify installers and create checksums
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -Path "target/release/bundle/msi" -Filter "*.msi" -File)
          $nsis = @(Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI installer, found $($msi.Count)."
          }
          if ($nsis.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($nsis.Count)."
          }

          $installers = @($msi[0], $nsis[0])
          $checksumPath = "target/release/bundle/SHA256SUMS.txt"
          $checksums = foreach ($installer in $installers) {
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $checksums | Set-Content -Path $checksumPath -Encoding ascii
          Get-Content -Path $checksumPath

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: RADsuite-windows-installers
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/SHA256SUMS.txt
