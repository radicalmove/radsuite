name: Verify platform packages

on:
  push:
    branches: [codex/radcast-cleanup-0.2.12]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-platform-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: Apple-Silicon
            bundles: app,dmg
          - runner: macos-15-intel
            name: Intel-Mac
            bundles: app,dmg
          - runner: windows-latest
            name: Windows-x64
            bundles: msi,nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate shared version
        run: python scripts/validate-release-version.py --tag v0.2.12
      - name: Install frontend
        working-directory: apps/desktop-ui
        run: npm ci
      - name: Verify Studio labels
        working-directory: apps/desktop-ui
        run: npm test -- --run src/lib/radcastStudio.test.ts
      - name: Verify Studio registration
        run: cargo test -p radsuite-engines --test studio
      - name: Verify pinned prebuilt Tauri CLI
        run: npx --yes --package @tauri-apps/cli@2.9.6 tauri --version
      - name: Build packages without publishing
        shell: bash
        run: npx --yes --package @tauri-apps/cli@2.9.6 tauri build --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'
      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: RADsuite-0.2.12-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
